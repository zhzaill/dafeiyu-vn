<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070f">
<meta name="description" content="一则深夜视觉小说短篇：你与「大肥鱼」的三档形态，在凌晨三点的对话框里相遇。">
<title>凌晨三点，蓝色大肥鱼</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23081020'/%3E%3Cpath d='M13 36c6-9 16-13 26-12 6 .6 11 3 14 7l7-6c-1 6-3 9-6 11 2 2 4 3 6 3-5 6-13 9-22 8-10-1-19-5-25-11z' fill='%23cfe0ff'/%3E%3Ccircle cx='43' cy='31' r='2.2' fill='%230b1526'/%3E%3C/svg%3E">
<style>
/* ==========================================================
   《凌晨三点，蓝色大肥鱼》 —— 视觉小说短篇
   ========================================================== */

:root{
  --bg-0:#04070f;
  --bg-1:#070d1b;
  --ink:#eef4ff;
  --ink-2:#c3d0e6;
  --ink-3:#8fa2c0;
  --line:rgba(158,190,255,.16);
  --blue:#7aa9ff;
  --cyan:#7fe0d8;
  --gold:#f0c680;
  --serif:"Source Han Serif SC","Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  --accent:#8fb8ff;
  --pad:clamp(18px,4vw,56px);
}

*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{height:100%;}
body{
  margin:0;
  background:#04070f;
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow:hidden;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
img{user-select:none;-webkit-user-drag:none;}

.app{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(120% 90% at 50% 8%, #0a1528 0%, #060b16 42%, #03060d 100%);
  isolation:isolate;
}

/* ---------- 氛围层 ---------- */
.plankton{
  position:absolute;inset:0;width:100%;height:100%;
  z-index:1;pointer-events:none;opacity:.85;
}
.glow-bleed{
  position:absolute;inset:-10%;
  z-index:0;pointer-events:none;
  background:radial-gradient(60% 55% at 50% 52%, rgba(70,120,210,.22), transparent 70%);
  filter:blur(30px);
}

/* 电影感暗角：压住四角与下缘，给水一点深度 */
.app::after{
  content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  background:
    radial-gradient(118% 96% at 50% 42%, rgba(2,5,12,0) 40%, rgba(2,5,12,.42) 74%, rgba(2,4,10,.86) 100%),
    linear-gradient(180deg, rgba(2,5,12,.32) 0%, rgba(2,5,12,0) 16%, rgba(2,5,12,0) 58%, rgba(2,5,12,.72) 100%);
}

/* ---------- 舞台 ---------- */
.stage{
  position:absolute;inset:0;z-index:2;
  transition:filter .9s ease, transform 1.2s cubic-bezier(.2,.7,.2,1);
}

.lightpool{
  position:absolute;inset:-20%;
  background:radial-gradient(circle var(--pool,640px) at 50% 48%,
    rgba(250,253,255,.99) 0%,
    rgba(240,247,255,.97) 16%,
    rgba(220,235,255,.9) 30%,
    rgba(184,212,252,.66) 46%,
    rgba(136,174,232,.4) 62%,
    rgba(80,118,186,.18) 82%,
    rgba(30,50,90,0) 100%);
  animation:breathe 14s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{opacity:.94;transform:scale(1);}
  50%{opacity:1;transform:scale(1.03);}
}

.waterline{
  position:absolute;left:0;right:0;top:66%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(200,226,255,.5),transparent);
  opacity:.28;filter:blur(.8px);
  transform:scaleX(.92);
}

.cast{
  position:absolute;inset:0;
  display:flex;justify-content:center;align-items:flex-end;
  pointer-events:none;
}
.sprite{
  position:absolute;left:50%;bottom:-8%;
  height:96%;
  transform:translateX(-50%) translateY(14px) scale(1.015);
  opacity:0;
  transition:opacity .55s ease, transform .8s cubic-bezier(.2,.7,.2,1), filter .6s ease;
  filter:drop-shadow(0 24px 60px rgba(4,10,24,.45));
  will-change:opacity,transform;
}
.sprite[data-form="tall"]{height:96%;bottom:-11%;}
.sprite[data-form="mid"]{height:90%;bottom:-10%;}
.sprite[data-form="chibi"]{height:56%;bottom:26%;}

.sprite.is-active{
  opacity:1;
  transform:translateX(-50%) translateY(0) scale(1);
}
.stage.is-narr .sprite.is-active{
  filter:drop-shadow(0 24px 60px rgba(4,10,24,.45)) brightness(.86) saturate(.94);
  transform:translateX(-50%) translateY(0) scale(.992);
}
.sprite.is-active[data-form="tall"]{filter:drop-shadow(0 0 70px rgba(120,170,255,.22)) drop-shadow(0 24px 60px rgba(4,10,24,.4));}
.stage.is-narr .sprite.is-active[data-form="tall"]{filter:drop-shadow(0 0 50px rgba(120,170,255,.14)) brightness(.86) saturate(.94);}

/* 选项浮现时，让她退到水下去 */
.stage.is-choosing .sprite.is-active[data-form]{
  filter:blur(3px) brightness(.62) saturate(.85);
  transform:translateX(-50%) translateY(0) scale(.985);
}

/* ---------- HUD ---------- */
.hud{
  position:absolute;top:0;left:0;right:0;z-index:20;
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:16px;
  padding:clamp(14px,2.4vw,26px) var(--pad);
  pointer-events:none;
  background:linear-gradient(180deg, rgba(3,6,13,.72), rgba(3,6,13,0));
}
.hud > *{pointer-events:auto;}

.hud-left{display:flex;flex-direction:column;gap:8px;}
.chip{
  display:inline-flex;align-items:center;gap:9px;
  padding:7px 13px 7px 11px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(9,16,30,.55);
  backdrop-filter:blur(10px);
  font-size:13px;letter-spacing:.06em;
  align-self:flex-start;
  transition:border-color .4s ease, box-shadow .4s ease;
}
.chip-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 10px var(--accent);
  transition:background .4s ease, box-shadow .4s ease;
}
.chip-name{color:var(--ink);font-weight:600;letter-spacing:.12em;}
.chip-tier{color:var(--ink-3);font-size:11.5px;letter-spacing:.1em;}
.chip.flash{animation:chipFlash .7s ease;}
@keyframes chipFlash{
  0%{border-color:var(--accent);box-shadow:0 0 0 0 rgba(140,180,255,.4);}
  100%{border-color:var(--line);box-shadow:0 0 0 14px rgba(140,180,255,0);}
}

.chapter{
  margin:0;padding-left:2px;
  font-family:var(--serif);
  font-size:12.5px;letter-spacing:.22em;
  color:var(--ink-3);
}

.hud-right{display:flex;align-items:center;gap:10px;}
.rice{
  margin:0 6px 0 0;
  display:inline-flex;align-items:baseline;gap:5px;
  font-size:12px;color:var(--ink-3);letter-spacing:.08em;
  font-variant-numeric:tabular-nums;
}
.rice-v{color:var(--gold);font-weight:600;font-size:14px;transition:color .3s;}
.rice.pop .rice-v{animation:pop .45s ease;}
@keyframes pop{0%{transform:scale(1.28);}100%{transform:scale(1);}}

.icon{
  min-width:34px;height:30px;padding:0 10px;
  border:1px solid var(--line);border-radius:8px;
  background:rgba(9,16,30,.45);
  color:var(--ink-2);
  font-size:12px;letter-spacing:.14em;
  backdrop-filter:blur(8px);
  transition:.25s ease;
}
.icon:hover{color:var(--ink);border-color:rgba(158,190,255,.4);background:rgba(22,36,62,.7);}
.icon[aria-pressed="false"]{opacity:.45;}

/* ---------- 对话框 ---------- */
.dialogue{
  position:absolute;left:0;right:0;bottom:0;z-index:30;
  display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  gap:14px;
  padding:0 var(--pad) clamp(18px,3.4vh,40px);
  pointer-events:none;
}
.dialogue > *{pointer-events:auto;}

.dbox{
  position:relative;
  width:min(1080px,100%);
  padding:clamp(18px,2.2vw,28px) clamp(20px,3vw,40px) clamp(16px,1.8vw,22px);
  border:1px solid var(--line);
  border-radius:16px;
  background:
    linear-gradient(180deg, rgba(10,17,32,.86) 0%, rgba(5,9,18,.94) 100%);
  backdrop-filter:blur(20px) saturate(115%);
  box-shadow:
    0 40px 90px rgba(0,0,0,.55),
    0 1px 0 rgba(255,255,255,.06) inset,
    0 0 0 1px rgba(0,0,0,.3);
  overflow:hidden;
}
.dbox::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,transparent,var(--accent),transparent);
  opacity:.85;transition:background .4s ease;
}
.dbox::after{
  content:"";position:absolute;right:-60px;top:-80px;width:220px;height:220px;
  background:radial-gradient(circle,rgba(120,160,255,.10),transparent 70%);
  pointer-events:none;
}

.nameplate{
  display:flex;align-items:baseline;gap:10px;
  margin-bottom:10px;
  min-height:22px;
}
.nameplate .name{
  font-family:var(--serif);
  font-size:17px;font-weight:600;letter-spacing:.2em;
  color:var(--accent);
  text-shadow:0 0 24px color-mix(in srgb, var(--accent) 40%, transparent);
  transition:color .35s ease;
}
.nameplate .tier{
  font-size:10.5px;letter-spacing:.2em;color:var(--ink-3);
  border:1px solid var(--line);border-radius:4px;padding:1px 6px;
}
.nameplate.is-hidden{opacity:0;}

.line{
  margin:0;
  min-height:3.9em;
  font-family:var(--serif);
  font-size:clamp(16px,1.45vw,20.5px);
  line-height:1.95;
  letter-spacing:.055em;
  color:var(--ink);
  text-shadow:0 1px 18px rgba(0,0,0,.5);
  word-break:break-word;
}
.line.is-narr{color:var(--ink-2);letter-spacing:.09em;font-size:clamp(15px,1.32vw,19px);}
.line.is-you{color:#e8eefc;}
.line.is-you::before{content:"「";color:var(--ink-3);}
.line.is-you::after{content:"」";color:var(--ink-3);}
.line.is-typing::after{
  content:"▍";
  margin-left:2px;
  color:var(--accent);
  animation:blink 1s steps(2,start) infinite;
}
@keyframes blink{50%{opacity:0;}}

.tap{
  position:absolute;right:18px;bottom:10px;
  margin:0;
  font-size:10.5px;letter-spacing:.18em;color:var(--ink-3);
  opacity:0;transition:opacity .3s ease;
}
.tap.show{opacity:.62;animation:tapPulse 2.4s ease-in-out infinite;}
@keyframes tapPulse{0%,100%{opacity:.42;}50%{opacity:.78;}}

/* ---------- 选项 ---------- */
.choices{
  order:-1;
  width:min(760px,100%);
  display:flex;flex-direction:column;gap:10px;
  animation:fadeUp .4s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.choices-prompt{
  margin:0 0 2px;
  font-family:var(--serif);
  font-size:13px;letter-spacing:.24em;color:var(--ink-3);
  text-align:center;
}
.choices-list{display:flex;flex-direction:column;gap:9px;}

.choice{
  display:flex;align-items:center;gap:14px;
  width:100%;padding:14px 18px;
  border:1px solid var(--line);border-radius:12px;
  background:linear-gradient(180deg, rgba(12,21,38,.94), rgba(7,13,24,.96));
  backdrop-filter:blur(18px) saturate(120%);
  text-align:left;
  font-family:var(--serif);
  font-size:clamp(14.5px,1.3vw,16.5px);
  letter-spacing:.06em;color:var(--ink-2);
  transition:transform .22s ease, border-color .22s ease, color .22s ease, background .22s ease;
  box-shadow:0 12px 30px rgba(0,0,0,.35);
}
.choice .idx{
  flex:0 0 auto;
  width:22px;height:22px;line-height:21px;text-align:center;
  border:1px solid var(--line);border-radius:50%;
  font-size:10.5px;font-family:var(--sans);color:var(--ink-3);
  transition:.22s ease;
}
.choice:hover{
  transform:translateY(-2px);
  border-color:color-mix(in srgb, var(--accent) 70%, transparent);
  color:var(--ink);
  background:linear-gradient(180deg, rgba(24,38,66,.9), rgba(12,20,36,.92));
}
.choice:hover .idx{color:var(--accent);border-color:var(--accent);}
.choice:active{transform:translateY(0) scale(.995);}

/* ---------- 全屏屏幕（标题 / 结局） ---------- */
.screen{
  position:absolute;inset:0;z-index:40;
  display:flex;align-items:center;justify-content:center;
  padding:var(--pad);
  text-align:center;
}
.screen[hidden]{display:none;}
.veil{
  position:absolute;inset:0;
  background:
    radial-gradient(64% 58% at 50% 44%, rgba(4,8,16,.34), rgba(3,5,11,.9) 76%),
    linear-gradient(180deg, rgba(3,6,13,.72), rgba(3,6,13,.88));
  backdrop-filter:blur(1px);
}
.title-inner,.end-inner{
  position:relative;z-index:1;
  width:min(760px,100%);
  animation:screenIn .9s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes screenIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}

.kicker{
  margin:0 0 clamp(18px,3vh,30px);
  font-size:10.5px;letter-spacing:.42em;color:var(--ink-3);
  text-transform:uppercase;
}

.title{margin:0;font-family:var(--serif);font-weight:500;line-height:1.28;}
.title span{display:block;}
.title .t1{
  font-size:clamp(24px,3.2vw,34px);
  letter-spacing:.34em;color:var(--ink-2);
  margin-bottom:.42em;
  padding-left:.34em;
}
.title .t2{
  font-size:clamp(44px,7.6vw,92px);
  letter-spacing:.1em;
  color:#f4f8ff;
  text-shadow:0 0 60px rgba(110,160,255,.42), 0 10px 40px rgba(0,0,0,.6);
  background:linear-gradient(180deg,#ffffff 10%,#cfe0ff 60%,#93b6ff 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}

.subtitle{
  margin:clamp(16px,2.6vh,26px) 0 0;
  font-family:var(--serif);
  font-size:clamp(13px,1.4vw,16px);
  letter-spacing:.3em;color:var(--ink-3);
}

.hairline{
  display:flex;align-items:center;justify-content:center;gap:16px;
  margin:clamp(24px,4vh,38px) auto clamp(26px,4.4vh,42px);
  width:min(420px,86%);
}
.hairline i{
  flex:1;height:1px;
  background:linear-gradient(90deg,transparent,rgba(158,190,255,.45),transparent);
}
.hairline b{
  font-family:var(--serif);font-weight:400;
  font-size:11px;letter-spacing:.36em;color:var(--ink-3);white-space:nowrap;
}

.start{
  padding:15px 54px;
  border:1px solid rgba(158,190,255,.42);
  border-radius:999px;
  font-family:var(--serif);
  font-size:16px;letter-spacing:.5em;text-indent:.5em;
  color:#eaf1ff;
  background:linear-gradient(180deg, rgba(38,62,110,.55), rgba(12,22,42,.7));
  box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 18px 50px rgba(30,60,120,.35);
  transition:.3s ease;
}
.start:hover{
  border-color:rgba(190,215,255,.85);
  box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 18px 60px rgba(60,110,200,.5), 0 0 40px rgba(120,170,255,.25) inset;
  transform:translateY(-2px);
}
.start:active{transform:translateY(0);}

.foot{
  position:relative;z-index:1;
  margin:clamp(26px,5vh,44px) 0 0;
  font-size:10.5px;letter-spacing:.16em;color:rgba(143,162,192,.7);
}

/* ---------- 结局 ---------- */
.end-title{
  margin:0;font-family:var(--serif);font-weight:500;
  font-size:clamp(32px,4.6vw,54px);letter-spacing:.14em;
  color:#f2f7ff;text-shadow:0 0 50px rgba(120,170,255,.4);
}
.end-sub{
  margin:14px 0 0;font-size:12px;letter-spacing:.3em;color:var(--ink-3);
}
.end-note{
  margin:clamp(18px,3vh,26px) auto 0;max-width:34em;
  font-family:var(--serif);font-size:14px;line-height:2;letter-spacing:.07em;
  color:var(--ink-2);
}
.end-stats{
  display:flex;justify-content:center;gap:clamp(26px,6vw,64px);
  margin:clamp(26px,4.6vh,44px) 0;
  padding:18px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.stat{display:flex;flex-direction:column;gap:6px;}
.stat-v{font-family:var(--serif);font-size:24px;color:var(--gold);font-variant-numeric:tabular-nums;}
.stat-k{font-size:10.5px;letter-spacing:.22em;color:var(--ink-3);}

.end-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;}
.btn{
  padding:12px 30px;border-radius:999px;
  border:1px solid rgba(158,190,255,.36);
  font-family:var(--serif);font-size:13.5px;letter-spacing:.24em;
  color:#eaf1ff;background:rgba(20,34,60,.6);
  transition:.25s ease;
}
.btn:hover{border-color:rgba(190,215,255,.8);background:rgba(32,52,90,.75);transform:translateY(-1px);}
.btn.ghost{background:transparent;color:var(--ink-2);}
.btn.ghost:hover{color:var(--ink);}

/* ---------- 弹层 ---------- */
.modal{
  position:absolute;inset:0;z-index:60;
  display:flex;align-items:center;justify-content:center;
  padding:var(--pad);
  background:rgba(2,5,11,.72);
  backdrop-filter:blur(8px);
  animation:fade .28s ease both;
}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.modal[hidden]{display:none;}

.modal-card{
  width:min(680px,100%);max-height:min(78vh,720px);
  display:flex;flex-direction:column;
  border:1px solid var(--line);border-radius:16px;
  background:linear-gradient(180deg, rgba(11,19,35,.97), rgba(6,11,22,.98));
  box-shadow:0 40px 90px rgba(0,0,0,.6);
  animation:screenIn .32s ease both;
  overflow:hidden;
}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:18px 22px;border-bottom:1px solid var(--line);
}
.modal-head h2{
  margin:0;font-family:var(--serif);font-weight:500;
  font-size:17px;letter-spacing:.2em;color:var(--ink);
}
.modal-body{
  padding:20px 22px 26px;overflow-y:auto;
  font-size:14px;line-height:1.95;color:var(--ink-2);
}
.modal-body h3{
  margin:20px 0 8px;font-family:var(--serif);font-weight:500;
  font-size:13px;letter-spacing:.22em;color:var(--accent);
}
.modal-body h3:first-child{margin-top:0;}
.modal-body p{margin:0 0 12px;}
.modal-body a{color:#9cc2ff;text-decoration:none;border-bottom:1px solid rgba(156,194,255,.35);}
.modal-body a:hover{border-bottom-color:#9cc2ff;}
.modal-body ul{margin:0 0 12px;padding-left:1.2em;}
.modal-body li{margin:0 0 6px;}
.modal-body .log-line{
  display:flex;gap:12px;padding:9px 0;
  border-bottom:1px dashed rgba(158,190,255,.12);
}
.modal-body .log-who{
  flex:0 0 4.5em;font-family:var(--serif);font-size:12px;letter-spacing:.14em;
  color:var(--accent);padding-top:2px;
}
.modal-body .log-text{flex:1;font-family:var(--serif);font-size:13.5px;line-height:1.85;}
.modal-body .log-line.narr .log-text{color:var(--ink-3);}
.modal-body .log-line.you .log-who{color:var(--ink-3);}
.modal-body .credit{font-size:11.5px;color:var(--ink-3);letter-spacing:.06em;}

/* ---------- 屏幕状态 ---------- */
.app[data-screen="title"] .stage{filter:blur(3px) brightness(.82) saturate(.92);transform:scale(1.02);}
.app[data-screen="title"] .hud,
.app[data-screen="title"] .dialogue{display:none;}
.app[data-screen="end"] .stage{filter:blur(3px) brightness(.45) saturate(.8);}
.app[data-screen="end"] .hud,
.app[data-screen="end"] .dialogue{pointer-events:none;}

/* ---------- 响应式 ---------- */
@media (max-width: 860px){
  :root{--pool:430px;}
  .sprite[data-form="tall"]{height:84%;bottom:-6%;}
  .sprite[data-form="mid"]{height:78%;bottom:-5%;}
  .sprite[data-form="chibi"]{height:46%;bottom:30%;}
  .waterline{top:60%;}
  .hud{padding:14px 16px;}
  .rice{display:none;}
  .chapter{font-size:11px;letter-spacing:.16em;}
  .dbox{border-radius:14px;}
  .dialogue{padding-bottom:14px;gap:10px;}
  .tap{display:none;}
  .end-stats{gap:26px;}
}

@media (max-height: 560px) and (orientation: landscape){
  .sprite[data-form="tall"]{height:100%;bottom:-10%;}

<script>
/* ==========================================================
 * 《凌晨三点，蓝色大肥鱼》 —— 引擎
 * 纯原生 JS，无构建。file:// 直接打开亦可运行。
 * ========================================================== */
(function () {
  'use strict';

  /* ---------------- DOM ---------------- */
  var app = document.getElementById('app');
  var stage = document.getElementById('stage');
  var sprites = Array.prototype.slice.call(document.querySelectorAll('.sprite'));

  var hud = document.getElementById('hud');
  var chip = document.getElementById('chip');
  var chipName = document.getElementById('chipName');
  var chipTier = document.getElementById('chipTier');
  var chapterEl = document.getElementById('chapter');
  var riceEl = document.getElementById('rice');
  var riceVal = document.getElementById('riceVal');

  var dialogue = document.getElementById('dialogue');
  var nameplate = document.getElementById('nameplate');
  var speakerEl = document.getElementById('speaker');
  var speakerTier = document.getElementById('speakerTier');
  var lineEl = document.getElementById('line');
  var hintEl = document.getElementById('hint');

  var choicesEl = document.getElementById('choices');
  var choicesPrompt = document.getElementById('choicesPrompt');
  var choicesList = document.getElementById('choicesList');

  var titleScreen = document.getElementById('titleScreen');
  var endScreen = document.getElementById('endScreen');
  var endTitle = document.getElementById('endTitle');
  var endSub = document.getElementById('endSub');
  var endNote = document.getElementById('endNote');
  var statRice = document.getElementById('statRice');
  var statLines = document.getElementById('statLines');

  var modal = document.getElementById('modal');
  var modalTitle = document.getElementById('modalTitle');
  var modalBody = document.getElementById('modalBody');

  /* ---------------- 常量 ---------------- */
  var TOKENS_PER_BOWL = 3600;
  var CHARS_PER_CHAR = 2.6;

  /* ---------------- 状态 ---------------- */
  var LABELS = {};
  var i = 0;
  var started = false;
  var ended = false;
  var typing = false;
  var typeTimer = null;
  var fullText = '';
  var caret = 0;
  var choicesOpen = false;
  var currentForm = null;
  var tokens = 0;
  var lineCount = 0;
  var log = [];

  (function buildLabels() {
    for (var k = 0; k < STORY.length; k++) {
      if (STORY[k].t === 'label') LABELS[STORY[k].name] = k;
    }
  })();

  /* ---------------- 声音 ---------------- */
  var Sound = {
    ctx: null,
    master: null,
    padGain: null,
    on: localStorage.getItem('dfy.sound') !== 'off',
    ready: false,

    start: function () {
      if (this.ready) return;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.on ? 0.5 : 0;
        this.master.connect(this.ctx.destination);
        this.buildPad();
        this.ready = true;
      } catch (e) { /* 静默失败 */ }
    },

    buildPad: function () {
      var ctx = this.ctx;
      var g = ctx.createGain();
      g.gain.value = 0.055;
      var lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 420;
      lp.Q.value = 0.6;
      g.connect(lp);
      lp.connect(this.master);
      this.padGain = g;

      [55, 82.41, 110].forEach(function (f, n) {
        var o = ctx.createOscillator();
        o.type = n === 2 ? 'sine' : 'triangle';
        o.frequency.value = f;
        var og = ctx.createGain();
        og.gain.value = n === 2 ? 0.16 : 0.34;
        o.connect(og); og.connect(g);
        o.start();

        // 缓慢起伏
        var lfo = ctx.createOscillator();
        lfo.frequency.value = 0.03 + n * 0.017;
        var lg = ctx.createGain();
        lg.gain.value = 0.09;
        lfo.connect(lg); lg.connect(og.gain);
        lfo.start();
      });

      // 水下的噪声层
      var len = ctx.sampleRate * 4;
      var buf = ctx.createBuffer(1, len, ctx.sampleRate);
      var d = buf.getChannelData(0);
      for (var s = 0; s < len; s++) d[s] = (Math.random() * 2 - 1) * 0.5;
      var noise = ctx.createBufferSource();
      noise.buffer = buf; noise.loop = true;
      var nf = ctx.createBiquadFilter();
      nf.type = 'bandpass'; nf.frequency.value = 700; nf.Q.value = 0.7;
      var ng = ctx.createGain(); ng.gain.value = 0.02;
      noise.connect(nf); nf.connect(ng); ng.connect(this.master);
      noise.start();
    },

    tone: function (freq, dur, vol, type) {
      if (!this.ready || !this.on) return;
      var ctx = this.ctx;
      var t = ctx.currentTime;
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + dur + 0.02);
    },

    blip: function () { this.tone(760 + Math.random() * 140, 0.09, 0.05, 'triangle'); },
    sting: function () {
      this.tone(520, 0.5, 0.05, 'sine');
      this.tone(780, 0.7, 0.028, 'sine');
    },
    click: function () { this.tone(1180, 0.06, 0.04, 'sine'); },
    end: function () {
      this.tone(196, 1.6, 0.06, 'sine');
      this.tone(392, 1.2, 0.03, 'sine');
    },

    setOn: function (v) {
      this.on = v;
      localStorage.setItem('dfy.sound', v ? 'on' : 'off');
      if (this.master) {
        this.master.gain.setTargetAtTime(v ? 0.5 : 0, this.ctx.currentTime, 0.12);
      }
    }
  };

  /* ---------------- 浮游生物 ---------------- */
  (function plankton() {
    var cv = document.getElementById('plankton');
    if (!cv) return;
    var ctx = cv.getContext('2d');
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = 0, h = 0, parts = [], raf = 0;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function resize() {
      w = cv.clientWidth; h = cv.clientHeight;
      cv.width = Math.floor(w * dpr); cv.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      seed();
    }

    function seed() {
      var n = Math.round(Math.min(46, Math.max(16, w / 26)));
      parts = [];
      for (var k = 0; k < n; k++) parts.push(make(true));
    }

    function make(anywhere) {
      return {
        x: Math.random() * w,
        y: anywhere ? Math.random() * h : h + Math.random() * 40,
        r: Math.random() * 1.7 + 0.4,
        v: Math.random() * 0.18 + 0.05,
        a: Math.random() * 0.35 + 0.06,
        ph: Math.random() * Math.PI * 2,
        sw: Math.random() * 0.5 + 0.15
      };
    }

    function frame(t) {
      ctx.clearRect(0, 0, w, h);
      for (var k = 0; k < parts.length; k++) {
        var p = parts[k];
        p.y -= p.v;
        p.x += Math.sin(t * 0.0004 + p.ph) * p.sw * 0.22;
        if (p.y < -10) { parts[k] = make(false); continue; }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(186,216,255,' + p.a + ')';
        ctx.fill();
      }
      raf = requestAnimationFrame(frame);
    }

    resize();
    window.addEventListener('resize', resize);
    if (!reduce) raf = requestAnimationFrame(frame);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { cancelAnimationFrame(raf); }
      else if (!reduce) { raf = requestAnimationFrame(frame); }
    });
  })();

  /* ---------------- 文本渲染 ---------------- */
  var PAUSE = { '，': 90, '。': 190, '？': 190, '！': 170, '、': 70, '；': 110, '：': 100, '…': 130, '—': 80, '「': 60, '」': 60 };

  function typeOut(text, cls) {
    lineEl.className = 'line ' + (cls || '') + ' is-typing';
    lineEl.textContent = '';
    fullText = text;
    caret = 0;
    typing = true;
    hintEl.classList.remove('show');

    var tick = function () {
      if (!typing) return;
      if (caret >= fullText.length) return finishType();
      var ch = fullText.charAt(caret++);
      lineEl.textContent = fullText.slice(0, caret);
      var d = 26 + Math.random() * 16 + (PAUSE[ch] || 0);
      typeTimer = setTimeout(tick, d);
    };
    tick();
  }

  function finishType() {
    clearTimeout(typeTimer);
    typing = false;
    lineEl.textContent = fullText;
    lineEl.classList.remove('is-typing');
    if (!choicesOpen) hintEl.classList.add('show');
  }

  /* ---------------- 形态 / HUD ---------------- */
  function setForm(form) {
    if (!form || form === currentForm) return;
    currentForm = form;
    sprites.forEach(function (s) {
      s.classList.toggle('is-active', s.getAttribute('data-form') === form);
    });
    var f = FORMS[form];
    if (!f) return;
    app.style.setProperty('--accent', f.color);
    chipName.textContent = f.name;
    chipTier.textContent = f.tier;
    chip.classList.remove('flash');
    void chip.offsetWidth;
    chip.classList.add('flash');
    Sound.sting();
  }

  function setSpeaker(form) {
    if (!form) {
      nameplate.classList.add('is-hidden');
      return;
    }
    nameplate.classList.remove('is-hidden');
    var f = FORMS[form];
    speakerEl.textContent = f.name;
    speakerTier.textContent = f.tier;
    speakerEl.style.color = f.color;
  }

  function addTokens(text) {
    tokens += Math.round(text.length * CHARS_PER_CHAR);
    var bowl = tokens / TOKENS_PER_BOWL;
    riceVal.textContent = bowl.toFixed(1);
    riceEl.classList.remove('pop');
    void riceEl.offsetWidth;
    riceEl.classList.add('pop');
  }

  /* ---------------- 剧情推进 ---------------- */
  function run() {
    var guard = 0;
    while (guard++ < 500) {
      var node = STORY[i];
      if (!node) return showEnd({ title: '本鲸记下了。', sub: '大肥鱼 · 三档形态', note: '' });

      switch (node.t) {
        case 'label':
          i++; continue;

        case 'jump':
          i = LABELS[node.to] != null ? LABELS[node.to] : STORY.length;
          continue;

        case 'chapter':
          chapterEl.textContent = node.text;
          if (chapterEl.animate) {
            chapterEl.animate(
              [{ opacity: 0, transform: 'translateY(-4px)' }, { opacity: 1, transform: 'none' }],
              { duration: 700, easing: 'ease' }
            );
          }
          i++; continue;

        case 'choice':
          return openChoices(node);

        case 'end':
          return showEnd(node);

        default:
          return renderLine(node);
      }
    }
  }

  function renderLine(node) {
    var isNarr = node.t === 'narr';
    var isYou = node.t === 'you';
    var form = isNarr || isYou ? null : node.form;

    stage.classList.toggle('is-narr', isNarr || isYou);
    if (form) setForm(form);
    setSpeaker(form);

    var cls = isNarr ? 'is-narr' : (isYou ? 'is-you' : '');
    typeOut(node.text, cls);

    if (node.text) {
      addTokens(node.text);
      lineCount++;
      log.push({ who: isNarr ? '旁白' : (isYou ? '你' : FORMS[form].name), text: node.text, cls: cls });
    }

    // 一行说完即可点击继续
    hintEl.classList.remove('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function () {
      if (!typing && !choicesOpen) hintEl.classList.add('show');
    }, 900);
  }
  var hintTimer = null;

  function openChoices(node) {
    choicesOpen = true;
    hintEl.classList.remove('show');
    stage.classList.add('is-choosing');
    choicesPrompt.textContent = node.prompt || '';
    choicesList.innerHTML = '';
    node.options.forEach(function (opt, idx) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'choice';
      b.innerHTML = '<span class="idx">' + (idx + 1) + '</span><span class="label">' + escapeHtml(opt.label) + '</span>';
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        pick(opt.goto);
      });
      b.addEventListener('mouseenter', function () { Sound.click(); });
      choicesList.appendChild(b);
    });
    choicesEl.hidden = false;
    choicesEl.style.animation = 'none';
    void choicesEl.offsetWidth;
    choicesEl.style.animation = '';
    if (typing) finishType();
  }

  function pick(goto) {
    Sound.click();
    choicesOpen = false;
    choicesEl.hidden = true;
    stage.classList.remove('is-choosing');
    i = LABELS[goto] != null ? LABELS[goto] : STORY.length;
    run();
  }

  function advance() {
    if (!started || ended) return;
    if (modalOpen) return;
    if (choicesOpen) return;
    if (typing) { finishType(); return; }
    i++;
    run();
  }

  /* ---------------- 结局 ---------------- */
  function showEnd(node) {
    ended = true;
    started = false;
    app.dataset.screen = 'end';
    endTitle.textContent = node.title || 'END';
    endSub.textContent = node.sub || '';
    endNote.textContent = node.note || '';
    statRice.textContent = (tokens / TOKENS_PER_BOWL).toFixed(1);
    statLines.textContent = String(lineCount);
    dialogue.hidden = true;
    hud.hidden = true;
    endScreen.hidden = false;
    Sound.end();
  }

  /* ---------------- 流程控制 ---------------- */
  function reset() {
    clearTimeout(typeTimer);
    typing = false;
    choicesOpen = false;
    choicesEl.hidden = true;
    ended = false;
    i = 0;
    tokens = 0;
    lineCount = 0;
    log = [];
    riceVal.textContent = '0.0';
    chapterEl.textContent = '';
    lineEl.textContent = '';
    nameplate.classList.add('is-hidden');
    endScreen.hidden = true;
    titleScreen.hidden = true;
    hud.hidden = false;
    dialogue.hidden = false;
    app.dataset.screen = 'play';
    stage.classList.remove('is-narr');
    stage.classList.remove('is-choosing');
    sprites.forEach(function (s) { s.classList.remove('is-active'); });
    currentForm = null;
  }

  function begin() {
    reset();
    started = true;
    Sound.start();
    run();
  }

  /* ---------------- 弹层 ---------------- */
  var modalOpen = false;

  function openModal(title, html) {
    modalTitle.textContent = title;
    modalBody.innerHTML = html;
    modal.hidden = false;
    modalOpen = true;
    modalBody.scrollTop = 0;
  }

  function closeModal() {
    modal.hidden = true;
    modalOpen = false;
  }

  function aboutHtml() {

      '<h3>这条鱼是谁</h3>',

      '<h3>名字的来历</h3>',

      '<h3>形象从哪来</h3>',

      '<p>本作里的三种形态——长裙、少女、Q 版——就是这条接力链上的三个尺寸，也被我演成三档模型：深潜档、常规档、轻量档。</p>',

      '<h3>延伸阅读</h3>',

      '</ul>'

  }

  function logHtml() {
    if (!log.length) return '<p class="credit">还没有说过话。</p>';
    return log.map(function (l) {
      return '<div class="log-line ' + l.cls + '"><span class="log-who">' + escapeHtml(l.who) +
        '</span><span class="log-text">' + escapeHtml(l.text) + '</span></div>';
    }).join('');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---------------- 事件 ---------------- */
  document.getElementById('btnStart').addEventListener('click', function (e) {
    e.stopPropagation();
    Sound.start();
    begin();

  document.getElementById('btnAgain').addEventListener('click', function (e) {

  document.getElementById('btnLog').addEventListener('click', function (e) {

  document.getElementById('btnAbout').addEventListener('click', function (e) {
    e.stopPropagation();
    openModal('关于「大肥鱼」', aboutHtml());
  });

  document.getElementById('btnAbout2').addEventListener('click', function (e) {
    e.stopPropagation();
    openModal('关于「大肥鱼」', aboutHtml());
  });

  document.getElementById('btnSound').addEventListener('click', function (e) {
    e.stopPropagation();
    Sound.start();
    Sound.setOn(!Sound.on);
    this.setAttribute('aria-pressed', Sound.on ? 'true' : 'false');
    if (Sound.on) Sound.click();
  });
  document.getElementById('btnSound').setAttribute('aria-pressed', Sound.on ? 'true' : 'false');

  document.getElementById('modalClose').addEventListener('click', function (e) {
    e.stopPropagation();
    closeModal();
  });

  modal.addEventListener('click', function (e) {
    e.stopPropagation();
    if (e.target === modal) closeModal();
  });

  // 点击 / 触摸推进
  app.addEventListener('click', function (e) {
    if (e.target.closest('button, a, .modal, .screen')) return;
    advance();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (modalOpen) closeModal(); return; }
    if (modalOpen) return;

    if (choicesOpen && /^[1-9]$/.test(e.key)) {
      var btn = choicesList.children[Number(e.key) - 1];
      if (btn) { btn.click(); e.preventDefault(); }
      return;
    }
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON' && e.key === 'Enter') return;
      e.preventDefault();
      advance();
    }
  });

  // 记录面板打开时禁止穿透（部分浏览器滚轮/点击）
  modal.addEventListener('wheel', function (e) { e.stopPropagation(); }, { passive: true });

  /* ---------------- 首屏 ---------------- */
  window.addEventListener('load', function () {
    app.dataset.screen = 'title';
    // 标题页：她沉在水底，只是影子
    stage.classList.add('is-narr');
    sprites[0].classList.add('is-active');
    currentForm = null;
  });
})();

</script>
</body>
</html>
